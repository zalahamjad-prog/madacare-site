# Tells Bing (and other IndexNow search engines) about changed pages right after each deploy,
# so new articles get picked up in hours instead of days. Key file: /18e13e47e67aa629f34455e14539d2b2.txt
name: IndexNow
on:
  push:
    branches: [main]
    paths: ["**/*.html", "sitemap.xml"]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for the site to deploy
        run: sleep 90
      - name: Send changed pages to IndexNow
        run: |
          urls=$(git diff --name-only HEAD~1 HEAD -- '*.html' \
            | grep '/index.html$\|^index.html$' \
            | sed -e 's#index.html$##' -e 's#^#https://madacare.sa/#' \
            | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "$urls"
          if [ "$urls" = "[]" ]; then exit 0; fi
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"madacare.sa\",\"key\":\"18e13e47e67aa629f34455e14539d2b2\",\"keyLocation\":\"https://madacare.sa/18e13e47e67aa629f34455e14539d2b2.txt\",\"urlList\":$urls}"
